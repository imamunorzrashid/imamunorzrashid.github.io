# Sveltia CMS configuration. In development it is served at /admin/index.html only (the build script removes dist/admin).
# Paths are relative to the repository root. Edit with Chrome or Edge via "Work with Local Repository".
backend:
  name: github
  repo: imamunorzrashid/imamunorzrashid.github.io
  branch: main
media_folder: public/images/uploads
public_folder: /images/uploads
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 80
          width: 1600
# Keeps generated filenames under Windows MAX_PATH when a slug comes from long text.
slug:
  maxlength: 60

collections:
  - name: pages
    label: Pages
    files:
      - name: profile
        label: Profile
        file: src/content/pages/profile.yaml
        fields:
          - { name: name, label: Name, widget: string }
          - { name: pub_name, label: Name in publications, widget: string, hint: 'For example: M. O. Rashid' }
          - { name: title, label: Title, widget: string }
          - { name: affiliation, label: Affiliation, widget: string }
          - { name: location, label: Location, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: photo, label: Photo, widget: image }
          - { name: photo_alt, label: Photo alt text, widget: string }
          - { name: bio, label: Bio, widget: markdown }
          - { name: now, label: Now, widget: markdown, required: false }
          - { name: now_date, label: Now date (YYYY or YYYY-MM), widget: string, required: false, pattern: ['^\d{4}(-(0[1-9]|1[0-2]))?$', 'Use YYYY or YYYY-MM'] }
          - { name: about_opening, label: About page opening, widget: markdown, required: false }
          - { name: audience_line, label: Audience line (home page), widget: markdown, required: false, hint: "Leave empty to show nothing on the home page" }
          - { name: seeking, label: Seeking, widget: string, required: false }
          - { name: interests, label: Research interests, widget: list, required: false }
          - name: links
            label: Links
            widget: object
            required: false
            fields:
              - { name: scholar, label: Google Scholar, widget: string, required: false, pattern: ['^https?://', 'Use a full URL starting with https://'] }
              - { name: orcid, label: ORCID, widget: string, required: false, pattern: ['^https?://', 'Use a full URL starting with https://'] }
              - { name: github, label: GitHub, widget: string, required: false, pattern: ['^https?://', 'Use a full URL starting with https://'] }
              - { name: linkedin, label: LinkedIn, widget: string, required: false, pattern: ['^https?://', 'Use a full URL starting with https://'] }
              - { name: researchgate, label: ResearchGate, widget: string, required: false, pattern: ['^https?://', 'Use a full URL starting with https://'] }
          - { name: cv_academic, label: Academic CV link, widget: string, required: false }
          - { name: cv_lecturer, label: Teaching CV link, widget: string, required: false }
          - { name: flag_counter, label: Flag Counter ID, widget: string, required: false, hint: 'Leave empty to hide the counter' }
          - name: skills
            label: Technical skills
            widget: list
            required: false
            fields:
              - { name: label, label: Label, widget: string }
              - { name: items, label: Items, widget: list, required: false }
      - name: research
        label: Research page
        file: src/content/pages/research.yaml
        fields:
          - { name: statement, label: Research statement, widget: markdown }
          - { name: questions, label: "Questions I'm working on", widget: list, required: false, hint: "2 to 4 open questions in plain words" }
          - name: themes
            label: Research themes
            widget: list
            required: false
            fields:
              - { name: title, label: Title, widget: string }
              - { name: summary, label: Summary, widget: markdown }
              - name: image
                label: Figure
                widget: object
                required: false
                fields:
                  - { name: src, label: Image, widget: image, required: false }
                  - { name: alt, label: Alt text, widget: string, required: false, hint: "Required when an image is set" }
                  - { name: caption, label: Caption, widget: string, required: false }
              - { name: story, label: Story (project file name), widget: string, required: false, hint: "The file name of a project with a story, without .yaml" }
      - name: teaching
        label: Teaching page
        file: src/content/pages/teaching.yaml
        fields:
          - { name: statement, label: Teaching statement, widget: markdown }
          - name: course_groups
            label: Courses I can teach (by department)
            widget: list
            required: false
            fields:
              - { name: department, label: Department, widget: string }
              - { name: courses, label: Courses, widget: list }
          - name: videos
            label: Videos
            widget: list
            required: false
            fields:
              - { name: url, label: Video URL, widget: string, pattern: ['^https?://', 'Use a full URL starting with https://'] }
              - { name: title, label: Title, widget: string }
              - { name: poster, label: Poster image, widget: image, required: false }

  - name: news
    label: News
    folder: src/content/news
    extension: yaml
    format: yaml
    create: true
    identifier_field: text
    slug: '{{date}}-{{slug}}'
    fields:
      - { name: date, label: Date (YYYY or YYYY-MM), widget: string, pattern: ['^\d{4}(-(0[1-9]|1[0-2]))?$', 'Use YYYY or YYYY-MM'] }
      - { name: text, label: Text, widget: markdown }
      - { name: link, label: Link, widget: string, required: false }

  - name: publications
    label: Publications
    folder: src/content/publications
    extension: yaml
    format: yaml
    create: true
    identifier_field: title
    slug: '{{slug}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: authors, label: Authors, widget: list }
      - { name: venue, label: Venue, widget: string }
      - { name: type, label: Type, widget: select, options: [journal, conference, preprint, thesis] }
      - { name: status, label: Status, widget: select, options: [published, accepted, under_review, in_preparation] }
      - { name: year, label: Year, widget: number, value_type: int, required: false, hint: 'Required unless status is accepted or in preparation' }
      - { name: doi, label: DOI, widget: string, required: false }
      - { name: url, label: URL, widget: string, required: false, pattern: ['^https?://', 'Use a full URL starting with https://'] }
      - { name: pdf, label: PDF, widget: string, required: false }
      - { name: code, label: Code link, widget: string, required: false, pattern: ['^https?://', 'Use a full URL starting with https://'] }
      - { name: featured, label: Featured, widget: boolean, default: false }
      - { name: note, label: Note, widget: text, required: false }
      - { name: abstract, label: Abstract, widget: markdown, required: false }
      - { name: plain, label: Plain-language line, widget: text, required: false, hint: "One plain-language line for the paper" }
      - { name: slides, label: Slides (PDF), widget: file, media_folder: public/docs, public_folder: /docs, accept: application/pdf, required: false, hint: "Upload a PDF (10 MB max), or paste a full https:// link" }
      - { name: video, label: Video URL, widget: string, required: false, pattern: ['^https?://', 'Use a full URL starting with https://'] }

  - name: projects
    label: Projects
    folder: src/content/projects
    extension: yaml
    format: yaml
    create: true
    identifier_field: title
    slug: '{{slug}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: kind, label: Kind, widget: select, options: [research, build], default: build }
      - { name: draft, label: Draft, widget: boolean, default: false, hint: "A draft story page is built only in dev" }
      - { name: order, label: Order, widget: number, value_type: int, default: 100, required: false }
      - { name: start, label: Start (YYYY or YYYY-MM), widget: string, required: false, pattern: ['^\d{4}(-(0[1-9]|1[0-2]))?$', 'Use YYYY or YYYY-MM'] }
      - { name: end, label: End (YYYY or YYYY-MM), widget: string, required: false, pattern: ['^\d{4}(-(0[1-9]|1[0-2]))?$', 'Use YYYY or YYYY-MM'] }
      - { name: role, label: My role, widget: string, required: false }
      - { name: team, label: Team, widget: string, required: false }
      - { name: tools, label: Tools, widget: list, required: false }
      - { name: outcome, label: Outcome, widget: string, required: false }
      - { name: standfirst, label: Standfirst, widget: string, required: false, hint: "One sentence shown under the title" }
      - { name: summary, label: Summary, widget: markdown }
      - { name: story, label: Story, widget: markdown, required: false, hint: "Suggested headings: What the problem was · What I did · What went wrong · What I'd do differently" }
      - { name: tags, label: Tags, widget: list, required: false }
      - name: links
        label: Links
        widget: list
        required: false
        fields:
          - { name: label, label: Label, widget: string }
          - { name: url, label: URL or PDF, widget: file, media_folder: public/docs, public_folder: /docs, accept: application/pdf, hint: "Paste a full https:// link, or upload a PDF (10 MB max)" }
      - name: images
        label: Images
        widget: list
        required: false
        fields:
          - { name: src, label: Image, widget: image }
          - { name: alt, label: Alt text, widget: string }
          - { name: caption, label: Caption, widget: string, required: false }
      - name: videos
        label: Videos
        widget: list
        required: false
        fields:
          - { name: url, label: Video URL, widget: string, pattern: ['^https?://', 'Use a full URL starting with https://'] }
          - { name: title, label: Title, widget: string }
          - { name: poster, label: Poster image, widget: image, required: false }
      - { name: image, label: Image, widget: image, required: false }
      - { name: image_alt, label: Image alt text (required if an image is set), widget: string, required: false }
      - { name: featured, label: Featured, widget: boolean, default: false }

  - name: education
    label: Education
    folder: src/content/education
    extension: yaml
    format: yaml
    create: true
    identifier_field: degree
    slug: '{{slug}}'
    fields:
      - { name: degree, label: Degree, widget: string }
      - { name: institution, label: Institution, widget: string }
      - { name: location, label: Location, widget: string, required: false }
      - { name: start, label: Start (YYYY or YYYY-MM), widget: string, required: false, pattern: ['^\d{4}(-(0[1-9]|1[0-2]))?$', 'Use YYYY or YYYY-MM'] }
      - { name: end, label: End (YYYY or YYYY-MM), widget: string, required: false, pattern: ['^\d{4}(-(0[1-9]|1[0-2]))?$', 'Use YYYY or YYYY-MM'] }
      - { name: thesis_title, label: Thesis title, widget: string, required: false }
      - { name: supervisor, label: Supervisor, widget: string, required: false }
      - { name: details, label: Details, widget: list, required: false }
      - { name: logo, label: Logo, widget: image, media_folder: public/images/logos, public_folder: /images/logos, required: false }
      - name: links
        label: Links
        widget: list
        required: false
        fields:
          - { name: label, label: Label, widget: string }
          - { name: url, label: URL or PDF, widget: file, media_folder: public/docs, public_folder: /docs, accept: application/pdf, hint: "Paste a full https:// link, or upload a PDF (10 MB max)" }
      - { name: story, label: Story (project file name), widget: string, required: false, hint: "The file name of the project that tells the story, without .yaml" }

  - name: experience
    label: Experience
    folder: src/content/experience
    extension: yaml
    format: yaml
    create: true
    identifier_field: role
    slug: '{{slug}}-{{org}}'
    fields:
      - { name: role, label: Role, widget: string }
      - { name: org, label: Organisation, widget: string }
      - { name: kind, label: Kind, widget: select, options: [research, industry, leadership] }
      - { name: start, label: Start (YYYY or YYYY-MM), widget: string, pattern: ['^\d{4}(-(0[1-9]|1[0-2]))?$', 'Use YYYY or YYYY-MM'] }
      - { name: end, label: End (YYYY or YYYY-MM), widget: string, required: false, pattern: ['^\d{4}(-(0[1-9]|1[0-2]))?$', 'Use YYYY or YYYY-MM'] }
      - { name: location, label: Location, widget: string, required: false }
      - { name: link, label: Link, widget: string, required: false, pattern: ['^https?://', 'Use a full URL starting with https://'] }
      - { name: points, label: Points, widget: list, required: false }
      - { name: logo, label: Logo, widget: image, media_folder: public/images/logos, public_folder: /images/logos, required: false }
      - name: image
        label: Image
        widget: object
        required: false
        fields:
          - { name: src, label: Image, widget: image, required: false }
          - { name: alt, label: Alt text, widget: string, required: false, hint: "Required when an image is set" }
          - { name: caption, label: Caption, widget: string, required: false }
      - name: links
        label: Links
        widget: list
        required: false
        fields:
          - { name: label, label: Label, widget: string }
          - { name: url, label: URL or PDF, widget: file, media_folder: public/docs, public_folder: /docs, accept: application/pdf, hint: "Paste a full https:// link, or upload a PDF (10 MB max)" }

  - name: teaching
    label: Teaching experience
    folder: src/content/teaching
    extension: yaml
    format: yaml
    create: true
    identifier_field: role
    slug: '{{slug}}-{{start}}'
    fields:
      - { name: role, label: Role, widget: string }
      - { name: context, label: Context, widget: string }
      - { name: start, label: Start (YYYY or YYYY-MM), widget: string, pattern: ['^\d{4}(-(0[1-9]|1[0-2]))?$', 'Use YYYY or YYYY-MM'] }
      - { name: end, label: End (YYYY or YYYY-MM), widget: string, required: false, pattern: ['^\d{4}(-(0[1-9]|1[0-2]))?$', 'Use YYYY or YYYY-MM'] }
      - { name: subjects, label: Subjects, widget: list, required: false }
      - { name: level, label: Level, widget: string, required: false }
      - { name: description, label: Description, widget: markdown, required: false }

  - name: awards
    label: Awards and honours
    folder: src/content/awards
    extension: yaml
    format: yaml
    create: true
    identifier_field: title
    slug: '{{slug}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: issuer, label: Issuer, widget: string }
      - { name: category, label: Category, widget: select, options: [academic, international] }
      - { name: date, label: Date (YYYY or YYYY-MM), widget: string, pattern: ['^\d{4}(-(0[1-9]|1[0-2]))?$', 'Use YYYY or YYYY-MM'] }
      - { name: end, label: End (YYYY or YYYY-MM), widget: string, required: false, pattern: ['^\d{4}(-(0[1-9]|1[0-2]))?$', 'Use YYYY or YYYY-MM'] }
      - { name: description, label: Description, widget: text, required: false }
      - name: image
        label: Image
        widget: object
        required: false
        fields:
          - { name: src, label: Image, widget: image, required: false }
          - { name: alt, label: Alt text, widget: string, required: false, hint: "Required when an image is set" }
          - { name: caption, label: Caption, widget: string, required: false }
      - { name: story, label: Story (project file name), widget: string, required: false, hint: "The file name of the project that tells the story, without .yaml" }
      - { name: link, label: Link, widget: string, required: false, pattern: ['^https?://', 'Use a full URL starting with https://'] }

  - name: activities
    label: Talks and service
    folder: src/content/activities
    extension: yaml
    format: yaml
    create: true
    identifier_field: title
    slug: '{{slug}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: kind, label: Kind, widget: select, options: [talk, service, reviewing, outreach] }
      - { name: event, label: Event, widget: string }
      - { name: video, label: Video URL, widget: string, required: false, pattern: ['^https?://', 'Use a full URL starting with https://'] }
      - { name: date, label: Date (YYYY or YYYY-MM), widget: string, pattern: ['^\d{4}(-(0[1-9]|1[0-2]))?$', 'Use YYYY or YYYY-MM'] }
      - { name: location, label: Location, widget: string, required: false }
      - { name: link, label: Link, widget: string, required: false, pattern: ['^https?://', 'Use a full URL starting with https://'] }

  - name: certificates
    label: Certificates
    folder: src/content/certificates
    extension: yaml
    format: yaml
    create: true
    identifier_field: title
    slug: '{{slug}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: issuer, label: Issuer, widget: string }
      - { name: date, label: Date (YYYY or YYYY-MM), widget: string, pattern: ['^\d{4}(-(0[1-9]|1[0-2]))?$', 'Use YYYY or YYYY-MM'] }
      - { name: credential_url, label: Credential URL, widget: string, required: false, pattern: ['^https?://', 'Use a full URL starting with https://'] }
      - name: image
        label: Image
        widget: object
        required: false
        fields:
          - { name: src, label: Image, widget: image, required: false }
          - { name: alt, label: Alt text, widget: string, required: false, hint: "Required when an image is set" }
          - { name: caption, label: Caption, widget: string, required: false }

  - name: gallery
    label: Gallery
    folder: src/content/gallery
    extension: yaml
    format: yaml
    create: true
    identifier_field: caption
    slug: '{{slug}}'
    fields:
      - { name: image, label: Image, widget: image }
      - { name: alt, label: Alt text, widget: string }
      - { name: caption, label: Caption, widget: string }
      - { name: date, label: Date (YYYY or YYYY-MM), widget: string, required: false, pattern: ['^\d{4}(-(0[1-9]|1[0-2]))?$', 'Use YYYY or YYYY-MM'] }
