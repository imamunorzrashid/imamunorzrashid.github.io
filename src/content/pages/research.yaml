statement: |-
  Power grids are moving toward networks of small microgrids that run on renewable sources and depend on communication between their controllers. More of these controllers are now learned from data, and in practice that data is limited, noisy and open to cyberattacks. My research asks how a distributed controller can stay reliable under those conditions without being retrained from scratch for every new system.

  So far I have approached this with transfer learning. A controller learned on clean data is adapted to degraded conditions in a few steps, which saves both data and training time. I have applied the same idea to detecting and correcting false data injection attacks, first at the frequency control layer and, in my thesis, at the economic dispatch layer above it. I test the controllers in simulation and in real time on an OPAL-RT OP5700.

  Next, I want to build physical models of the grid more directly into these learning methods, so that the controllers need less data and fail in more predictable ways.
themes:
  - title: Data-efficient frequency control with transfer learning
    summary: 'Frequency controllers for multi-microgrids built on dynamic neural networks are usually trained on clean, plentiful data. I train a controller on clean data and transfer it to noisy, data-scarce conditions in two phases: first with frozen layers, then with Bayesian-regularized fine-tuning. Compared with models trained from scratch on the same degraded data, this reduced MSE by up to 64% and training time by up to 35%. I tested it under packet loss, non-Gaussian noise and on a six-area system, with real-time validation on OPAL-RT. Across the two-area degradation scenarios, settling time stayed within 1.71% of the source controller. [(Energy Conversion and Management: X, 2026)](https://www.sciencedirect.com/science/article/pii/S259017452600379X)'
  - title: Cyber-resilient control against false data injection
    summary: A false data injection attack corrupts the measurements a microgrid’s controllers rely on and can push its frequency off target. I built a distributed framework to detect and mitigate these attacks. An autoregressive DNN detects the attack from its residuals, a PI compensator counteracts it, and Bayesian transfer learning, anchored at the source weights, adapts the detector to new conditions. Against an LSTM-based detector with the same mitigation stage, it cut maximum frequency deviation by 86.2% and settling time by 93.8%. My B.Sc. thesis extends the framework to coordinated attacks on both the frequency regulation and economic dispatch layers, using dual DNN estimators, and tests it under up to 50% data scarcity and 50% packet loss on a six-area network. (Next Energy, [accepted](https://www.researchgate.net/publication/417648405_Enhancing_Cyber-resilient_Frequency_Control_of_Isolated_Microgrids_Under_Composite_Noise_A_Collaborative_Learning-Based_Distributed_Framework))
  - title: Low-leakage transformerless PV inverters
    summary: I worked on an optimized unipolar PWM scheme for a modified H7 transformerless PV inverter. The scheme brought leakage current down to 7.14 mA, against 32.5 mA for the conventional H7, at 98.37% efficiency with THD within IEEE 519 limits. I built the MATLAB/Simulink models, analyzed the results, wrote the first draft and prepared the reviewer responses. [(IEEE ICM 2025)](https://ieeexplore.ieee.org/document/10934771)
