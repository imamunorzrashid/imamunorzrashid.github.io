statement: 'I would like to teach the circuits, electronics, control and computing courses that mechatronics is built on, from Electric Circuits and Power Electronics to programming, digital logic and machine learning. My work so far combines control, power electronics, embedded systems and machine learning, so when I teach one of these I can show students where it ends up: on a lab bench or in a research problem.'
course_groups:
