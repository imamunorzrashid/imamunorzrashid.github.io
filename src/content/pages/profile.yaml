bio: |-
  I am a Mechatronics Engineering graduate of Rajshahi University of Engineering & Technology (RUET), with a CGPA of 3.90/4.00 (3rd of 59), working on data-efficient control and cyber-physical security for microgrids.

  In the EPIC Research Group there, supervised by Subrata Kumar Sarker, I studied how distributed frequency controllers can keep working when their training data is scarce, noisy or under attack. My first-author paper in _Energy Conversion and Management: X_ (2026) transfers a dynamic neural network controller trained on clean data to degraded conditions through two-phase transfer learning, cutting error by up to 64% and training time by up to 35% against training from scratch, with real-time validation on OPAL-RT. A second first-author paper, accepted in _Next Energy_, extends the approach to detecting and mitigating false data injection attacks. My undergraduate thesis carries it from frequency regulation up to the economic dispatch layer.
