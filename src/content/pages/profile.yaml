bio: 'I completed my B.Sc. in Mechatronics Engineering from RUET with a CGPA of 3.90/4.00, ranking 3rd among 58 students. My research focuses on artificial intelligence, data-driven modeling, transfer learning, and intelligent systems, supported by practical experience in Python, MATLAB, TensorFlow/Keras, PyTorch, and real-time simulation. With international research publications and experience in technical training, student mentoring, and engineering leadership, I aim to contribute to teaching, applied research, and technological innovation in AI and Data Science.'
