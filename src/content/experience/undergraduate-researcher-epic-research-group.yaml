role: 'Undergraduate Researcher'
org: 'EPIC Research Group, RUET (Supervisor: Subrata Kumar Sarker)'
kind: research
start: '2025'
end: '2026'
points:
  - 'Proposed a data-efficient distributed frequency controller for multi-microgrids that transfers a dynamic neural network trained on clean data to noisy, data-scarce conditions via two-phase transfer learning (frozen, then Bayesian-regularized fine-tuning); reduced MSE by up to 64% and training time by up to 35% vs. models trained from scratch on the same degraded data. First author, Energy Conversion and Management: X, 2026.'
  - 'Evaluated intra- and inter-microgrid transfer, packet loss, non-Gaussian noise, and a six-area system, with real-time validation on an OPAL-RT OP5700 simulator; settling time stayed within 1.71% of the source controller across two-area degradation scenarios.'
  - 'Extended the approach to cyber-physical security: a distributed false data injection (FDI) detection-and-mitigation framework combining an autoregressive DNN residual detector, a PI compensator, and Bayesian transfer learning anchored at source weights; vs. an LSTM-based detector with the same mitigation stage, cut maximum frequency deviation by 86.2% and settling time by 93.8%. First author, accepted for publication in Next Energy.'
  - 'B.Sc. thesis: extended the FDI framework from the secondary (frequency regulation) to the tertiary (economic dispatch) control layer using dual DNN estimators and independent PI compensators, mitigating coordinated multi-layer attacks; evaluated transfer learning under up to 50% data scarcity and 50% packet loss, and validated scalability on a six-area network.'
