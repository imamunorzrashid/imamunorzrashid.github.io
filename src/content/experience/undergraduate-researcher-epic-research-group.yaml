role: 'Undergraduate Researcher'
org: 'EPIC Research Group, RUET (Supervisor: Subrata Kumar Sarker)'
kind: research
start: '2025'
end: '2026'
points:
  - 'Proposed a data-efficient distributed frequency controller for multi-microgrids. It transfers a dynamic neural network trained on clean data to noisy, data-scarce conditions through two-phase transfer learning (frozen layers first, then Bayesian-regularized fine-tuning). Compared with models trained from scratch on the same degraded data, it reduced MSE by up to 64% and training time by up to 35%. First author, Energy Conversion and Management: X, 2026.'
  - 'Evaluated intra- and inter-microgrid transfer, packet loss, non-Gaussian noise and a six-area system, with real-time validation on an OPAL-RT OP5700 simulator. Across the two-area degradation scenarios, settling time stayed within 1.71% of the source controller.'
  - 'Extended the approach to cyber-physical security with a distributed framework that detects and mitigates false data injection (FDI) attacks. It combines an autoregressive DNN residual detector, a PI compensator and Bayesian transfer learning anchored at the source weights. Compared with an LSTM-based detector using the same mitigation stage, it cut maximum frequency deviation by 86.2% and settling time by 93.8%. First author, accepted for publication in Next Energy.'
  - 'B.Sc. thesis: extended the FDI framework from the secondary (frequency regulation) to the tertiary (economic dispatch) control layer, using dual DNN estimators and independent PI compensators to mitigate coordinated multi-layer attacks. Evaluated transfer learning under up to 50% data scarcity and 50% packet loss, and validated scalability on a six-area network.'
