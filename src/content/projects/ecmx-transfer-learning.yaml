story: "Frequency controllers for multi-microgrids built on dynamic neural networks are usually trained on clean, plentiful data. I train a controller on clean data and transfer it to noisy, data-scarce conditions in two phases: first with frozen layers, then with Bayesian-regularized fine-tuning. Compared with models trained from scratch on the same degraded data, this reduced MSE by up to 64% and training time by up to 35%. I tested it under packet loss, non-Gaussian noise and on a six-area system, with real-time validation on OPAL-RT. Across the two-area degradation scenarios, settling time stayed within 1.71% of the source controller. [(Energy Conversion and Management: X, 2026)](https://www.sciencedirect.com/science/article/pii/S259017452600379X)\n\nTODO(Mamun): answers to the story questions.\n"
